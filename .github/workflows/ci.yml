name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22, 24]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run unit tests
        run: npm test
      - name: Validate JavaScript and JSON
        run: |
          node --check index.js
          python -m json.tool config.schema.json > /dev/null
      - name: Validate Python scripts
        run: python -m py_compile get_nowplaying.py get_appletv_status.py
      - name: Verify package contents
        run: npm pack --dry-run
